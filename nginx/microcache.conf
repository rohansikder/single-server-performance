proxy_cache_path /var/cache/nginx/feed levels=1:2 keys_zone=feed:10m max_size=64m inactive=30s;
server {
  listen 80;
  client_max_body_size 8k;
  location = /feed {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache feed;
    proxy_cache_key "$request_method|$host|$request_uri";
    # This location is an explicitly public feed; proxy owns its one-second TTL.
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    # Bound waiters during a cold fill; on timeout they query upstream.
    proxy_cache_lock_timeout 100ms;
    proxy_cache_methods GET HEAD;
    proxy_cache_bypass $http_authorization $http_cookie;
    proxy_no_cache $http_authorization $http_cookie;
    add_header X-Proxy-Cache $upstream_cache_status always;
  }
  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
